  SP_01_RUN:
    opcua:     {identifier: ExampleSps.Sp01.PumpRunState}
    historian: {tag: EXAMPLE_SPS.SP_01.PUMP_RUN_STATE}
    mqtt:      {topic: example/events/wastewater/EXAMPLE_SPS/SP_01/PumpRunState}
  SP_01_TRIP:
    opcua:     {identifier: ExampleSps.Sp01.PumpTripAlarm}
    historian: {tag: EXAMPLE_SPS.SP_01.PUMP_TRIP_ALARM}
    mqtt:      {topic: example/events/wastewater/EXAMPLE_SPS/SP_01/PumpTripAlarm}
  SP_02_RUN:
    opcua:     {identifier: ExampleSps.Sp02.PumpRunState}
    historian: {tag: EXAMPLE_SPS.SP_02.PUMP_RUN_STATE}
