# Example Wastewater System, file 3 of 3: THE BINDINGS (where each value lives).
#
# This file is a LEARNING EXAMPLE. Every name, identifier, tag, topic and value in it is invented for this
# repository. It does not describe any real plant, utility, equipment, control system or address.
#
# Who would own it: the automation or SCADA group. It changes when a system is replaced or a tag is renamed.
#
# In a real model, never share this file outside your organisation: addresses are sensitive.

# The change record. It names both type versions it was checked against: the shared file and the local one.
change: {date: 2026-10-10, approvedBy: Integration lead, typesVersion: {shared: 0.2.0, local: 0.3.0},
         reason: "Bind the new pump alarms and currents, the high-high level alarm and the screen differential level"}

# Measurement topics follow the pattern
#   example/telemetry/wastewater/{site}/{area}/{asset}/{key}
measurements:
  WET_WELL_LEVEL:
    opcua:     {identifier: ExampleSps.WetWell.Level}
    historian: {tag: EXAMPLE_SPS.WET_WELL.LEVEL}
    mqtt:      {topic: example/telemetry/wastewater/EXAMPLE_SPS/PUMPING/WET_WELL/LEVEL}
  FORCEMAIN_A_PRESSURE:
    opcua:     {identifier: CollA.ForcemainA.Pressure}
    historian: {tag: COLL_A.FORCEMAIN_A.PRESSURE}
    mqtt:      {topic: example/telemetry/wastewater/COLL_A/FORCEMAINS_A/FORCEMAIN_A/PRESSURE}
  FORCEMAIN_A_FLOW:
    opcua:     {identifier: CollA.ForcemainA.Flow}
    historian: {tag: COLL_A.FORCEMAIN_A.FLOW}
    mqtt:      {topic: example/telemetry/wastewater/COLL_A/FORCEMAINS_A/FORCEMAIN_A/FLOW}
  AERATION_01_DO:
    opcua:     {identifier: ExampleWwtp.Aeration01.Do}
    historian: {tag: EXAMPLE_WWTP.AERATION_01.DO}
    mqtt:      {topic: example/telemetry/wastewater/EXAMPLE_WWTP/SECONDARY/AERATION_01/DO}
  SCREEN_01_DIFF_LEVEL:
    opcua:     {identifier: ExampleWwtp.Screen01.DiffLevel}
    historian: {tag: EXAMPLE_WWTP.SCREEN_01.DIFF_LEVEL}
    mqtt:      {topic: example/telemetry/wastewater/EXAMPLE_WWTP/HEADWORKS/SCREEN_01/DIFF_LEVEL}
  SP_01_CURRENT:
    opcua:     {identifier: ExampleSps.Sp01.Current}
    historian: {tag: EXAMPLE_SPS.SP_01.CURRENT}
    mqtt:      {topic: example/telemetry/wastewater/EXAMPLE_SPS/PUMPING/SP_01/CURRENT}
  SP_02_CURRENT:
    opcua:     {identifier: ExampleSps.Sp02.Current}
    historian: {tag: EXAMPLE_SPS.SP_02.CURRENT}
    mqtt:      {topic: example/telemetry/wastewater/EXAMPLE_SPS/PUMPING/SP_02/CURRENT}

# Event topics follow the pattern
