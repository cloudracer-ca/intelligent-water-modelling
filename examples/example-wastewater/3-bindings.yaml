  SP_01_FAIL_TO_START:
    opcua:     {identifier: ExampleSps.Sp01.FailToStartAlarm}
    historian: {tag: EXAMPLE_SPS.SP_01.FAIL_TO_START_ALARM}
    mqtt:      {topic: example/events/wastewater/EXAMPLE_SPS/SP_01/FailToStartAlarm}
  SP_02_FAIL_TO_START:
    opcua:     {identifier: ExampleSps.Sp02.FailToStartAlarm}
    historian: {tag: EXAMPLE_SPS.SP_02.FAIL_TO_START_ALARM}
    mqtt:      {topic: example/events/wastewater/EXAMPLE_SPS/SP_02/FailToStartAlarm}
  FORCEMAIN_A_STATE:
