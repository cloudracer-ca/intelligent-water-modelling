    historian: {tag: EXAMPLE_WWTP.BLOWER_01.FAIL_TO_START_ALARM}
    mqtt:      {topic: example/events/wastewater/EXAMPLE_WWTP/BLOWER_01/FailToStartAlarm}

# Where each record lives. Links and file paths are sensitive, so none is shown.
records:
  SOP_WW_01:   {system: documents, id: SOP-WW-01}
  DWG_SPS_001: {system: documents, id: DWG-SPS-001}

# What the same asset is called in other systems.
assetIdentifiers:
  SP_01:           {maintenance: EQ-40011}
  SP_02:           {maintenance: EQ-40012}
  FORCEMAIN_A:     {maintenance: EQ-50003, gis: FM-0001}
  AERATION_01_AIT: {maintenance: EQ-60021}

# Records that are looked up, not listed.
lookups:
  WorkOrder: {system: maintenance, by: maintenance}
  VerificationRecord: {system: maintenance, by: maintenance}
