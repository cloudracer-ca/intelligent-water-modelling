# Example Wastewater System, file 2 of 3: THE PLANT (what you have).
#
# This file is a LEARNING EXAMPLE. Every name, identifier, tag, topic and value in it is invented for this
# repository. It does not describe any real plant, utility, equipment, control system or address.
#
# The question this model answers: "when the wet well level is high, what should we look at first?"
# Follow the relationships at the end of the file: the pumps, the forcemain, then the screen downstream.
#
# Every type named here is defined in the shared file (../example-plant/1-types.yaml) or in 1-local-types.yaml.
#
# Who would own it: asset management, with wastewater operations. It changes when the plant changes.

change: {date: 2026-10-10, approvedBy: Operations manager, typesVersion: 0.3.0,
         reason: "Add pump fail-to-start alarms and motor currents, a high-high level alarm, a screen differential level, and grit removal and primary settling between the screen and the aeration basin"}

# ------------------------------------------------------------------------------------------------ assets
assets:
  # --- the pumping station
  EXAMPLE_SPS: {type: Site, displayName: Example Sewage Pumping Station, topicSegment: EXAMPLE_SPS}
  PUMPING: {type: Area, displayName: Wet well and pumps, parent: EXAMPLE_SPS}
  WET_WELL: {type: WetWell, displayName: Wet well, parent: PUMPING}
  SP_01: {type: Pump, displayName: Sewage pump 1, parent: PUMPING}
  SP_02: {type: Pump, displayName: Sewage pump 2, parent: PUMPING}

  # --- the forcemain to the plant
  COLLECTION_A: {type: Network, displayName: Collection network A, topicSegment: COLL_A}
  FORCEMAINS_A: {type: Area, displayName: Forcemains, parent: COLLECTION_A}
  FORCEMAIN_A: {type: Forcemain, displayName: Forcemain A (station to plant), parent: FORCEMAINS_A}

  # --- part of the treatment plant
  EXAMPLE_WWTP: {type: Site, displayName: Example Wastewater Treatment Plant, topicSegment: EXAMPLE_WWTP}
  HEADWORKS: {type: Area, displayName: Headworks, parent: EXAMPLE_WWTP}
  PRIMARY: {type: Area, displayName: Primary treatment, parent: EXAMPLE_WWTP}
  SECONDARY: {type: Area, displayName: Secondary treatment, parent: EXAMPLE_WWTP}
  SCREEN_01: {type: Screen, displayName: Inlet screen 1, parent: HEADWORKS}
  GRIT_01: {type: GritChamber, displayName: Grit chamber 1, parent: HEADWORKS}
  PRIMARY_01: {type: Clarifier, displayName: Primary settling tank 1, parent: PRIMARY}
  AERATION_01: {type: AerationBasin, displayName: Aeration basin 1, parent: SECONDARY}
  BLOWER_01: {type: Blower, displayName: Blower 1, parent: SECONDARY}
  BLOWER_02: {type: Blower, displayName: Blower 2, parent: SECONDARY}
  CLARIFIER_01: {type: Clarifier, displayName: Secondary clarifier 1, parent: SECONDARY}
  AERATION_01_AIT: {type: Instrument, displayName: Aeration basin 1 oxygen probe, parent: AERATION_01}

# ------------------------------------------------------------------------------------------------ records
# Pointers only. Work orders and verification records are looked up, not listed (see 3-bindings.yaml).
records:
  SOP_WW_01:
    type: Procedure
    displayName: "SOP-WW-01: response to a high wet well level"
    revision: "1"
  DWG_SPS_001:
    type: Drawing
    displayName: "DWG-SPS-001: pumping station and forcemain"
    revision: "B"

# ------------------------------------------------------------------------------------------------ measurements
measurements:
  WET_WELL_LEVEL:        {asset: WET_WELL,    type: Level,           key: LEVEL,    unit: m,     displayName: Wet well level,
                          quality: {range: [0, 6]}}
  FORCEMAIN_A_PRESSURE:  {asset: FORCEMAIN_A, type: Pressure,        key: PRESSURE, unit: kPa,   displayName: Forcemain A pressure,
                          quality: {range: [0, 600]}}   # a forcemain runs at a lower pressure than a water main
  FORCEMAIN_A_FLOW:      {asset: FORCEMAIN_A, type: Flow,            key: FLOW,     unit: "L/s", displayName: Forcemain A flow}
  AERATION_01_DO:        {asset: AERATION_01, type: DissolvedOxygen, key: DO,       unit: mg/L,  displayName: Aeration basin 1 dissolved oxygen}
  # A blinded screen shows here first. A small value means the screen is not what is holding the flow back.
  SCREEN_01_DIFF_LEVEL:  {asset: SCREEN_01,   type: DifferentialLevel, key: DIFF_LEVEL, unit: m, displayName: Inlet screen 1 differential level}
  # A pump that is called and draws current, then stops, tried to start. One that draws none was never asked.
  SP_01_CURRENT:         {asset: SP_01,       type: MotorCurrent,    key: CURRENT,  unit: A,     displayName: Sewage pump 1 motor current}
  SP_02_CURRENT:         {asset: SP_02,       type: MotorCurrent,    key: CURRENT,  unit: A,     displayName: Sewage pump 2 motor current}

# ------------------------------------------------------------------------------------------------ events
events:
  WET_WELL_HIGH_LEVEL:      {asset: WET_WELL,    type: HighLevelAlarm,   displayName: Wet well high-level alarm}
  WET_WELL_HIGH_HIGH_LEVEL: {asset: WET_WELL,    type: HighHighLevelAlarm, displayName: Wet well high-high-level alarm}
  SP_01_RUN:                {asset: SP_01,       type: PumpRunState,     displayName: Sewage pump 1 run state}
  SP_01_TRIP:               {asset: SP_01,       type: PumpTripAlarm,    displayName: Sewage pump 1 trip alarm}
  SP_02_RUN:                {asset: SP_02,       type: PumpRunState,     displayName: Sewage pump 2 run state}
  SP_02_TRIP:               {asset: SP_02,       type: PumpTripAlarm,    displayName: Sewage pump 2 trip alarm}
  # A pump that is called to run and does not. Without these, a standby that fails to take over looks
  # the same as a pump that was never asked.
  SP_01_FAIL_TO_START:      {asset: SP_01,       type: FailToStartAlarm, displayName: Sewage pump 1 fail-to-start alarm}
  SP_02_FAIL_TO_START:      {asset: SP_02,       type: FailToStartAlarm, displayName: Sewage pump 2 fail-to-start alarm}
  FORCEMAIN_A_STATE:        {asset: FORCEMAIN_A, type: MainState,        displayName: Forcemain A state}
  BLOWER_01_FAIL_TO_START:  {asset: BLOWER_01,   type: FailToStartAlarm, displayName: Blower 1 fail-to-start alarm}

# ------------------------------------------------------------------------------------------------ relationships
relationships:
  # the sewage path
  - {source: WET_WELL, type: Feeds, target: SP_01}
  - {source: WET_WELL, type: Feeds, target: SP_02}
  - {source: SP_01, type: Feeds, target: FORCEMAIN_A}
  - {source: SP_02, type: Feeds, target: FORCEMAIN_A}
  - {source: FORCEMAIN_A, type: Feeds, target: SCREEN_01}
  # after screening: grit removal, then primary settling, then the aeration basin. Nothing is measured on
  # these two in this example; they are here so the path is the real one.
  - {source: SCREEN_01, type: Feeds, target: GRIT_01}
  - {source: GRIT_01, type: Feeds, target: PRIMARY_01}
  - {source: PRIMARY_01, type: Feeds, target: AERATION_01}
  - {source: AERATION_01, type: Feeds, target: CLARIFIER_01}
  # the air path, kept apart from the sewage path
  - {source: BLOWER_01, type: SuppliesAir, target: AERATION_01}
  - {source: BLOWER_02, type: SuppliesAir, target: AERATION_01}
  # protection: the screen keeps debris out of what follows it
  - {source: SCREEN_01, type: Protects, target: GRIT_01}
  # observation
  - {source: AERATION_01_AIT, type: Monitors, target: AERATION_01}
  # governance and records
  - {source: WET_WELL, type: GovernedBy, target: SOP_WW_01}
  - {source: WET_WELL, type: ShownOn, target: DWG_SPS_001}
  - {source: FORCEMAIN_A, type: ShownOn, target: DWG_SPS_001}
